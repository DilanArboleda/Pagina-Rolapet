<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RolaPet - Moderación de Contenido</title>
  <link rel="icon" href="../../../../images/fevicon/alfiler.png" type="image/gif" />
  <link rel="stylesheet" href="../../../../css/bootstrap.min.css" />
  <link rel="stylesheet" href="../../../../css/style.css" />
  <link rel="stylesheet" href="../../../../css/responsive.css" />
  <link rel="stylesheet" href="../../../../css/colors1.css" />
  <link rel="stylesheet" href="../../../../css/custom.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="moderacion_Admin.css">
</head>

<body id="default_theme" class="it_service">
  <div class="container-dashboard">

    <!-- HAMBURGUESA -->
    <div class="hamburger" onclick="toggleSidebar()">
      <i class="fa fa-bars"></i>
    </div>

    <!-- SIDEBAR -->
    <!-- SIDEBAR -->
    <div id="sidebar-container"></div>
    <script type="module">
      import { renderSidebar } from '../../../../js/components/AdminSidebar.js';
      renderSidebar('sidebar-container');
    </script>

    <!-- HEADER SUPERIOR -->
    <header class="top-header">
      <div class="logo">
        <a href="../../../../index.html"><img src="../../../../images/logos/LogoRolaPet.png" alt="logo" /></a>
      </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
      <h1>Moderación de Contenido</h1>

      <div class="tabs">
        <button class="active" type="button">Publicaciones Pendientes</button>
        <button type="button">Comentarios Pendientes</button>
      </div>

      <div class="filters">
        <input id="searchInput" type="text" placeholder="Buscar..." />
        <select>
          <option>Filtrar por Usuario</option>
        </select>
        <select>
          <option>Filtrar por Fecha</option>
        </select>
      </div>

      <!-- TARJETA 1 -->
      <div class="card mod-row" id="mod-1">
        <img src="https://i.pravatar.cc/61" alt="Usuario" />
        <div class="text">
          <strong>Soha Vergara</strong><br>
          Este texto contiene una palabra <span class="highlight">inapropiada</span> que debe revisarse.
        </div>
        <div class="actions">
          <button class="btn-edit">Editar</button>
          <button class="btn-reject" onclick="removeCard('mod-1')">Rechazar</button>
          <button class="btn-approve">Aprobar</button>
        </div>
      </div>

      <!-- TARJETA 2 -->
      <div class="card mod-row" id="mod-2">
        <img src="https://i.pravatar.cc/62" alt="Usuario" />
        <div class="text">
          <strong>Juan Pérez</strong><br>
          Esta publicación contiene <span class="highlight">palabra-mala</span> y debe moderarse.
        </div>
        <div class="actions">
          <button class="btn-edit">Editar</button>
          <button class="btn-reject" onclick="removeCard('mod-2')">Rechazar</button>
          <button class="btn-approve">Aprobar</button>
        </div>
      </div>
    </main>

    <!-- PANEL DERECHO -->
    <aside class="right-panel">
      <h3>Gestionar Palabras Bloqueadas</h3>

      <input id="newWord" type="text" placeholder="Añadir nueva palabra...">
      <button type="button" onclick="addWord()">Añadir</button>

      <div class="word-list" id="wordList">
        <div><span>inapropiada</span> <i onclick="deleteWord(this)" class="fa-solid fa-trash"></i></div>
        <div><span>palabra-mala</span> <i onclick="deleteWord(this)" class="fa-solid fa-trash"></i></div>
        <div><span>ofensiva</span> <i onclick="deleteWord(this)" class="fa-solid fa-trash"></i></div>
        <div><span>bloqueada</span> <i onclick="deleteWord(this)" class="fa-solid fa-trash"></i></div>
      </div>
    </aside>

  </div>

  <script src="js/jquery.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/menumaker.js"></script>
  <script src="js/wow.js"></script>
  <script src="js/custom.js"></script>
  <script type="module" src="moderacion_Admin.js"></script>
</body>

</html>
