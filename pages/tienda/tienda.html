<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>RolaPet - Catálogo</title>

  <link rel="icon" href="/images/fevicon/alfiler.png" />

  <!-- Bootstrap -->
  <link rel="stylesheet" href="/css/bootstrap.min.css">

  <!-- Estilos -->
  <link rel="stylesheet" href="/css/style.css">

  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Lightbox -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css">

  <script src="/components/header-usuario/header-usuario.js" defer></script>

  <style>
    .catalogo-link.active {
      background-color: #f0f0f0;
      font-weight: bold;
      color: #007bff !important;
    }

    .categary li a:hover {
      background-color: #f8f9fa;
    }

    .categary li a {
      display: block;
      padding: 8px 12px;
      transition: all 0.3s ease;
      border-radius: 4px;
    }
  </style>
</head>

<body id="default_theme" class="it_shop_list">

  <!-- Loader -->
  <div class="bg_load">
    <img class="loader_animation" src="/images/loaders/scoote.png" alt="loader" />
  </div>

  <!-- Header -->
  <header-admin></header-admin>

  <!-- ===========================
         PRODUCTOS
    ============================ -->
  <h2 class="titulo-catalogo">Productos</h2>

  <div class="section padding_layout_1 product_list_main">
    <div class="container">
      <div class="row">

        <!-- Contenedor de productos -->
        <div class="col-md-9">
          <div id="product-container" class="row">
            <!-- JS pinta productos aquí -->
          </div>
        </div>

        <!-- Sidebar -->
        <div class="col-md-3">
          <div class="side_bar">

            <div class="side_bar_blog">
              <h4>BÚSQUEDA</h4>
              <div class="side_bar_search">
                <div class="input-group stylish-input-group">
                  <input class="form-control" placeholder="Buscar productos..." type="text">
                  <span class="input-group-addon">
                    <button type="submit"><i class="fa fa-search"></i></button>
                  </span>
                </div>
              </div>
            </div>

            <div class="side_bar_blog">
              <h4>Ir a Servicios</h4>
              <p>Explora nuestros servicios disponibles</p>
              <a class="btn sqaure_bt" href="#servicios">Ver Servicios</a>
            </div>

            <div class="side_bar_blog">
              <h4>CATÁLOGOS</h4>
              <ul class="categary" id="catalogos-list">
                <!-- JS pinta catálogos aquí -->
              </ul>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ===========================
         SERVICIOS
    ============================ -->
  <h2 id="servicios" class="titulo-catalogo">Servicios</h2>

  <div class="section padding_layout_1 service_list">
    <div class="container">
      <div class="row" id="services-container">
        <!-- JS pinta servicios aquí -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js"></script>
  <script src="/js/bootstrap.min.js"></script>
  <script src="/js/menumaker.js"></script>
  <script src="/js/wow.js"></script>
  <script src="/js/custom.js"></script>

  <!-- Tu archivo JS -->
  <script type="module" src="./tienda.js"></script>

</body>

</html>
