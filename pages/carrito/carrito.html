<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="keywords" content="">

  <link rel="icon" href="/images/fevicon/alfiler.png" type="image/gif" />

  <!-- Lightbox CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css">

  <!-- bootstrap css -->
  <link rel="stylesheet" href="/css/bootstrap.min.css" />
  <!-- Site css -->
  <link rel="stylesheet" href="/css/style.css" />

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- responsive css -->
  <link rel="stylesheet" href="/css/responsive.css" />
  <!-- colors css -->
  <link rel="stylesheet" href="/css/colors1.css" />

  <link rel="stylesheet" href="/css/custom.css" />

  <link rel="stylesheet" href="/css/animate.css" />

  <!-- CSS personalizado para carrito -->
  <link rel="stylesheet" href="./carrito.css" />

  <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
      <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>

<body id="default_theme" class="it_shop_list">
  <!-- loader -->
  <div class="bg_load"> <img class="loader_animation" src="images/loaders/scoote.png" alt="#" /> </div>
  <!-- end loader -->

  <!-- header -->
  <header id="default_header" class="header_style_1">
    <!-- header bottom -->
    <div class="header_bottom">
      <div class="container">
        <div class="row">
          <div class="col-lg-3 col-md-12 col-sm-12 col-xs-12">
            <!-- logo start -->
            <div class="logo"> <a href="/index.html"><img src="/images/logos/LogoRolaPet.png" alt="logo" /></a> </div>
            <!-- logo end -->
          </div>
          <div class="col-lg-9 col-md-12 col-sm-12 col-xs-12">
            <!-- menu start -->
            <div class="menu_side">
              <div id="navbar_menu">
                <ul class="first-ul">
                  <li><a href="/index.html">Inicio</a></li>
                  <li><a href="/pages/tienda/tienda.html">Catálogo</a></li>
                  <li><a href="/pages/noticias_blog/noticias_blog.html">Blog</a></li>
                  <li><a href="/pages/mapa/mapa.html">Mapa</a></li>
                  <!-- TODO: hacer lo necesario -->
                  <li><a href="/pages/perfil_usuario/perfil_usuario.html">Perfil</a></li>
                  <li>
                    <a class="active" href="./carrito.html">
                      <i class="fa-solid fa-cart-shopping"></i>
                    </a>
                  </li>
                </ul>
              </div>
            </div>
            <!-- menu end -->
          </div>
        </div>
      </div>
    </div>
    <!-- header bottom end -->
  </header>
  <!-- end header -->

  <!-- Contenido del carrito -->
  <div class="carrito-container">
    <h1 class="carrito-titulo">Mi Carrito de Compras</h1>

    <div class="row">
      <!-- Productos del carrito -->
      <div class="col-md-8">
        <!-- Producto 1 -->
        <div class="carrito-producto">
          <img src="/images/it_service/producto1.png" alt="Dual-Sided Rack Pannier" class="carrito-img">
          <div class="carrito-detalles">
            <div class="carrito-nombre">Dual-Sided Rack Pannier</div>
            <div class="carrito-precio">$25.00</div>
            <div class="carrito-cantidad">
              <button class="qty-btn">-</button>
              <span>1</span>
              <button class="qty-btn">+</button>
            </div>
          </div>
          <button class="eliminar-btn" onclick="eliminarProducto(1)">
            <i class="fa fa-trash"></i>
          </button>
        </div>

        <!-- Producto 2 -->
        <div class="carrito-producto">
          <img src="/images/it_service/producto3.png" alt="Planet Bike K.O.K.O" class="carrito-img">
          <div class="carrito-detalles">
            <div class="carrito-nombre">Planet Bike K.O.K.O Bike Rack</div>
            <div class="carrito-precio">$12.49</div>
            <div class="carrito-cantidad">
              <button class="qty-btn">-</button>
              <span>2</span>
              <button class="qty-btn">+</button>
            </div>
          </div>
          <button class="eliminar-btn" onclick="eliminarProducto(2)">
            <i class="fa fa-trash"></i>
          </button>
        </div>

        <!-- Producto 3 -->
        <div class="carrito-producto">
          <img src="/images/it_service/producto5.png" alt="Morral Ciclismo" class="carrito-img">
          <div class="carrito-detalles">
            <div class="carrito-nombre">Morral Ciclismo Impermeable</div>
            <div class="carrito-precio">$25.00</div>
            <div class="carrito-cantidad">
              <button class="qty-btn">-</button>
              <span>1</span>
              <button class="qty-btn">+</button>
            </div>
          </div>
          <button class="eliminar-btn" onclick="eliminarProducto(3)">
            <i class="fa fa-trash"></i>
          </button>
        </div>
      </div>

      <!-- Resumen del carrito -->
      <div class="col-md-4">
        <div class="carrito-producto" style="flex-direction: column;">
          <h3>Resumen de Compra</h3>
          <div style="margin: 20px 0;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
              <span>Subtotal (3 productos):</span>
              <span>$62.49</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
              <span>Envío:</span>
              <span>Gratis</span>
            </div>
            <div class="carrito-total">
              <strong>Total: $62.49</strong>
            </div>
          </div>

          <a href="/pages/tienda/tienda.html" class="btn-carrito btn-seguir">
            <i class="fa fa-arrow-left"></i> Seguir Comprando
          </a>
          <a href="/checkout.html" class="btn-carrito btn-finalizar">
            <i class="fa fa-credit-card"></i> Finalizar Compra
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- js section -->
  <script src="../../js/jquery.min.js"></script>
  <!-- Lightbox JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js"></script>
  <script>
    lightbox.option({
      'resizeDuration': 200,
      'wrapAround': true
    });
  </script>
  <script src="../../js/bootstrap.min.js"></script>
  <!-- menu js -->
  <script src="../../js/menumaker.js"></script>
  <!-- wow animation -->
  <script src="../../js/wow.js"></script>
  <!-- custom js -->
  <script src="../../js/custom.js"></script>

  <!-- Funciones del carrito -->
  <script src="carrito.js"></script>
</body>

</html>
