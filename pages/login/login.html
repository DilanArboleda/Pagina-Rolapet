<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RolaPet - Login</title>
    <!-- Interno -->
    <link rel="stylesheet" href="login.css" />
    <!--  -->
    <link rel="icon" href="../../images/fevicon/alfiler.png" type="image/png" />
    <!-- bootstrap css -->
    <link rel="stylesheet" href="../../css/bootstrap.min.css" />
    <!-- Site css -->
    <link rel="stylesheet" href="../../css/style.css" />
    <!-- responsive css -->
    <link rel="stylesheet" href="../../css/responsive.css" />
    <!-- colors css -->
    <link rel="stylesheet" href="../../css/colors1.css" />
    <!-- custom css -->
    <link rel="stylesheet" href="../../css/custom.css" />
    <!-- wow Animation css -->
    <link rel="stylesheet" href="../../css/animate.css" />
    <!-- revolution slider css -->
    <link rel="stylesheet" type="text/css" href="../../revolution/css/settings.css" />
    <link rel="stylesheet" type="text/css" href="../../revolution/css/layers.css" />
    <link rel="stylesheet" type="text/css" href="../../revolution/css/navigation.css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#2094f3',
                        'background-light': '#F4F7F9',
                        'background-dark': '#101a22',
                        'text-title': '#666666',
                        'text-body': '#8C8C8C',
                        'border-color': '#E0E0E0',
                    },
                    fontFamily: {
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    borderRadius: { DEFAULT: '0.25rem', lg: '0.5rem', xl: '0.75rem', full: '9999px' },
                },
            },
        }
    </script>
</head>

<body id="default_theme" class="it_service font-display">
    <!-- loader -->
    <div class="bg_load"> <img class="loader_animation" src="../../images/loaders/scoote.png" alt="#" /> </div>
    <!-- end loader -->
    <!-- header -->
    <header id="default_header" class="header_style_1">
        <!-- header bottom -->
        <div class="header_bottom">
            <div class="container">
                <div class="row">
                    <div class="col-lg-3 col-md-12 col-sm-12 col-xs-12">
                        <!-- logo start -->
                        <div class="logo"> <a href="../../index.html"><img src="../../images/logos/LogoRolaPet.png"
                                    alt="logo" /></a> </div>
                        <!-- logo end -->
                    </div>
                    <div class="col-lg-9 col-md-12 col-sm-12 col-xs-12">
                        <!-- menu start -->
                        <div class="menu_side">
                            <div id="navbar_menu">
                                <ul class="first-ul">
                                    <li><a href="index.html">Inicio</a></li>
                                    <li><a href="catalogo_no_registrados.html">Catálogo</a></li>
                                </ul>
                            </div>
                        </div>
                        <!-- menu end -->
                    </div>
                </div>
            </div>
        </div>
    </header>
    <!-- end header -->
    <div
        class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
        <div class="layout-container flex h-full grow flex-col">
            <div class="px-4 md:px-10 lg:px-40 flex flex-1 justify-center py-10 md:py-20">
                <div
                    class="layout-content-container flex flex-col w-full max-w-[720px] flex-1 bg-white dark:bg-background-dark/50 p-6 sm:p-8 md:p-12 rounded-xl shadow-sm">
                    <div class="flex flex-wrap justify-between gap-3 pb-8">
                        <div class="flex min-w-72 flex-col gap-2">
                            <h1
                                class="text-text-title dark:text-gray-200 text-3xl md:text-4xl font-bold tracking-tight">
                                Iniciar Sesión</h1>
                            <p class="text-text-body dark:text-gray-400 text-base font-normal leading-normal">Selecciona
                                tu tipo de usuario para continuar</p>
                        </div>
                    </div>
                    <div class="user-type-selector">
                        <button class="user-type-btn active" data-type="user">
                            <span class="material-symbols-outlined">person</span>
                            <span>Usuario</span>
                        </button>
                        <button class="user-type-btn" data-type="provider">
                            <span class="material-symbols-outlined">store</span>
                            <span>Proveedor</span>
                        </button>
                        <button class="user-type-btn" data-type="admin">
                            <span class="material-symbols-outlined">admin_panel_settings</span>
                            <span>Admin</span>
                        </button>
                    </div>

                    <div class="error-message" id="errorMessage">
                        <span class="material-symbols-outlined">error</span>
                        <span id="errorText">Error de autenticación</span>
                    </div>

                    <div class="success-message" id="successMessage">
                        <span class="material-symbols-outlined">check_circle</span>
                        <span id="successText">Inicio de sesión exitoso</span>
                    </div>

                    <form id="loginForm">
                        <div class="form-group">
                            <label for="email">Correo Electrónico</label>
                            <div class="input-wrapper">
                                <span class="material-symbols-outlined">mail</span>
                                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <div class="input-wrapper">
                                <span class="material-symbols-outlined">lock</span>
                                <input type="password" id="password" name="password" placeholder="••••••••" required>
                                <span class="material-symbols-outlined toggle-password"
                                    id="togglePassword">visibility_off</span>
                            </div>
                        </div>

                        <div class="form-options">
                            <div class="remember-me">
                                <input type="checkbox" id="remember" name="remember">
                                <label for="remember">Recordarme</label>
                            </div>
                            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                        </div>

                        <button type="submit" class="submit-btn">
                            <span>Iniciar Sesión</span>
                            <span class="material-symbols-outlined">arrow_forward</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="../../js/jquery.min.js"></script>
    <script src="../../js/bootstrap.min.js"></script>
    <!-- menu js -->
    <script src="../../js/menumaker.js"></script>
    <!-- wow animation -->
    <script src="../../js/wow.js"></script>
    <!-- custom js -->
    <script src="../../js/custom.js"></script>
    <!-- revolution js files -->
    <script src="../../revolution/js/jquery.themepunch.tools.min.js"></script>
    <script src="../../revolution/js/jquery.themepunch.revolution.min.js"></script>
    <script src="../../revolution/js/extensions/revolution.extension.actions.min.js"></script>
    <script src="../../revolution/js/extensions/revolution.extension.carousel.min.js"></script>
    <script src="../../revolution/js/extensions/revolution.extension.kenburn.min.js"></script>
    <script src="../../revolution/js/extensions/revolution.extension.layeranimation.min.js"></script>
    <script src="../../revolution/js/extensions/revolution.extension.migration.min.js"></script>
    <script src="../../revolution/js/extensions/revolution.extension.navigation.min.js"></script>
    <script src="../../revolution/js/extensions/revolution.extension.parallax.min.js"></script>
    <script src="../../revolution/js/extensions/revolution.extension.slideanims.min.js"></script>
    <script src="../../revolution/js/extensions/revolution.extension.video.min.js"></script>
    <script type="module" src="login.js"></script>
</body>

</html>
